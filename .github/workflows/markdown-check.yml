name: Markdown Check

on:
push:
branches: [main]
pull_request:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
markdown-check:
name: Check Markdown files
runs-on: ubuntu-latest

steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Check Markdown formatting
    run: |
      npx --yes markdownlint-cli2 \
        "**/*.md" \
        "#node_modules"
